name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q

  build:
    # Proves the package builds and the console script starts from the wheel
    # alone (it must fail fast with a configuration error when unconfigured).
    # The release workflow repeats this on a tag before publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Smoke the wheel
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$(mktemp -d)"
          if uvx --from "$wheel" cnc-mcp </dev/null 2>stderr.txt; then
            echo "expected a configuration error from an unconfigured server" >&2
            exit 1
          fi
          grep -q "Configuration error" stderr.txt
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
